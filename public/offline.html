<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline | Rhoam</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ff5a5f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  img {
    width: 120px;
    margin-bottom: 24px;
  }
  h1 {
    color: #ffffff;
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    margin: 0 0 24px;
    max-width: 280px;
    line-height: 1.5;
  }
  button {
    background: #ffffff;
    color: #ff5a5f;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Rhoam" />
    <h1>You're offline</h1>
    <p>Reconnect to browse new listings. Anything you've already viewed recently may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
